<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Сканер</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #e8edf3;
      padding: 15px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 26px; color: #1a1a2e; letter-spacing: -0.5px; }
    .header p { color: #888; font-size: 14px; margin-top: 4px; }
    
    .card { background: #f8f9fc; border-radius: 14px; padding: 16px; margin: 12px 0; }
    .card-title { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 6px 0;
      text-align: center;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-green { background: #34C759; color: white; }
    .btn-green:hover { background: #2db84e; }
    .btn-blue { background: #007AFF; color: white; }
    .btn-blue:hover { background: #0066dd; }
    .btn-orange { background: #FF9500; color: white; }
    .btn-orange:hover { background: #e68600; }
    .btn-red { background: #FF3B30; color: white; }
    .btn-red:hover { background: #e0352b; }
    .btn-outline { background: transparent; color: #007AFF; border: 2px solid #007AFF; }
    .btn-outline:hover { background: #007AFF; color: white; }
    
    .input-group { display: flex; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
    .input-group select, .input-group input {
      flex: 1;
      min-width: 100px;
      padding: 12px 14px;
      border: 2px solid #e5e5ea;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      -webkit-appearance: none;
      appearance: none;
    }
    .input-group select:focus, .input-group input:focus { border-color: #007AFF; outline: none; }
    
    .info-row { display: flex; justify-content: space-between; padding: 10px 14px; background: white; border-radius: 10px; margin: 8px 0; border: 1px solid #e5e5ea; }
    .info-row .label { color: #888; font-size: 14px; }
    .info-row .value { font-weight: 700; font-size: 18px; color: #1a1a2e; }
    
    #status { padding: 12px 16px; border-radius: 10px; margin: 10px 0; display: none; font-size: 14px; }
    .status-success { background: #d4edda; color: #155724; display: block; }
    .status-error { background: #f8d7da; color: #721c24; display: block; }
    .status-info { background: #d1ecf1; color: #0c5460; display: block; }
    
    .divider { text-align: center; color: #ccc; margin: 15px 0; font-size: 13px; }
    .divider span { background: white; padding: 0 15px; position: relative; z-index: 1; }
    .divider::after { content: ''; display: block; height: 1px; background: #e5e5ea; margin-top: -10px; }
    
    .scanner-box { background: #1a1a2e; border-radius: 14px; padding: 30px 20px; text-align: center; color: white; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .scanner-box .icon { font-size: 56px; margin-bottom: 10px; }
    .scanner-box p { font-size: 15px; opacity: 0.8; margin-bottom: 15px; }
    .scanner-box .hint { font-size: 12px; opacity: 0.5; margin-top: 8px; }
    
    #video { width: 100%; border-radius: 12px; display: none; max-height: 350px; object-fit: cover; background: #000; }
    .result-box { margin: 12px 0; padding: 14px; background: #f8f9fc; border-radius: 12px; border-left: 4px solid #34C759; display: none; }
    .result-box label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    .result-box input { width: 100%; padding: 10px; border: 1px solid #e5e5ea; border-radius: 8px; font-size: 14px; background: white; margin: 4px 0; }
    
    .hidden { display: none !important; }
    #camera-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; display: none; }
    #camera-container video { width: 100%; display: block; }
    #camera-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; pointer-events: none; }
    #camera-overlay .scan-frame { width: 200px; height: 200px; border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; margin: 0 auto; position: relative; }
    #camera-overlay .scan-frame::before { content: ''; position: absolute; top: -2px; left: -2px; width: 30px; height: 30px; border-top: 3px solid #4CAF50; border-left: 3px solid #4CAF50; border-radius: 4px 0 0 0; }
    #camera-overlay .scan-frame::after { content: ''; position: absolute; bottom: -2px; right: -2px; width: 30px; height: 30px; border-bottom: 3px solid #4CAF50; border-right: 3px solid #4CAF50; border-radius: 0 0 4px 0; }
    .scan-line { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: #4CAF50; animation: scanLine 2s ease-in-out infinite; }
    @keyframes scanLine { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📦 QR Сканер</h1>
    <p>Система учёта отгрузок</p>
  </div>
  
  <!-- ===== СКАНЕР ===== -->
  <div class="card">
    <div class="card-title">📷 Сканер QR-кода</div>
    
    <div class="scanner-box" id="scannerBox">
      <span class="icon">📷</span>
      <p id="scannerText">Наведите камеру на QR-код</p>
      <button class="btn btn-green" id="scanBtn" onclick="startCamera()">▶ Запустить сканер</button>
      <button class="btn btn-red hidden" id="stopBtn" onclick="stopCamera()">⏹ Остановить</button>
      <div class="hint">💡 Или используйте ручной ввод ниже</div>
    </div>
    
    <div id="camera-container">
      <video id="video" autoplay playsinline muted></video>
      <div id="camera-overlay">
        <div class="scan-frame"><div class="scan-line"></div></div>
      </div>
    </div>
    
    <div class="result-box" id="resultBox">
      <label>📋 Данные QR-кода:</label>
      <input type="text" id="qrResult" readonly>
      <button class="btn btn-blue" onclick="confirmShipment()">✅ Подтвердить отгрузку</button>
    </div>
  </div>
  
  <div id="status"></div>
  
  <!-- ===== РУЧНОЙ ВВОД ===== -->
  <div class="card">
    <div class="card-title">✏️ Ручной ввод</div>
    
    <div style="font-size:13px;color:#888;margin-bottom:6px;">Выбор из списка</div>
    <div class="input-group">
      <select id="partSelect" onchange="onPartSelect()">
        <option value="">⏳ Загрузка...</option>
      </select>
      <input type="number" id="qtyInput" placeholder="Кол-во" value="1" min="1" style="max-width:90px;">
    </div>
    <div class="info-row">
      <span class="label">📊 Доступно:</span>
      <span class="value" id="availableDisplay">-</span>
    </div>
    <button class="btn btn-blue" onclick="manualOperation('ship')">📦 Отгрузить</button>
    <button class="btn btn-green" style="background: #28a745; margin-top: 8px;" onclick="manualOperation('receive')">📥 Принять на склад</button>
    <button class="btn btn-red" style="background: #dc3545; margin-top: 8px;" onclick="manualOperation('writeOff')">🗑️ Списать (Брак/Утеря)</button>
    
    <div class="divider"><span>ИЛИ</span></div>
    
    <div style="font-size:13px;color:#888;margin-bottom:6px;">Ввод парт-номера вручную</div>
    <div class="input-group">
      <input type="text" id="manualPartInput" placeholder="Например: PART-001" autofocus>
      <input type="number" id="manualQtyInput" placeholder="Кол-во" value="1" min="1" style="max-width:90px;">
    </div>
    <button class="btn btn-orange" onclick="manualPartShipment()">📦 Отгрузить вручную</button>
  </div>
  
  <button class="btn btn-outline" onclick="loadParts()" style="margin-top:10px;font-size:14px;padding:12px;">🔄 Обновить список</button>
</div>

<script>
  // ============================================================
  // ⚠️ ВАЖНО: ВСТАВЬТЕ СЮДА ВАШ URL ИЗ APPS SCRIPT (заканчивается на /exec)
  // ============================================================
  // Используем CORS Proxy для обхода блокировки Google
const API_URL = 'https://corsproxy.io/?' + encodeURIComponent('https://script.google.com/macros/s/AKfycbzDFNAhpmTim1WbYK2AdlryveKqEOpBnboj7k_RCDbftPi-z7ob6jCNCa06Q8XITDga/exec'); 

  let videoStream = null;
  let scanInterval = null;
  let scannedData = null;
  let partList = [];

  // ============================================================
  // API ЗАПРОСЫ (С ОТЛАДКОЙ В КОНСОЛЬ)
  // ============================================================
  async function apiGet(action) {
  try {
    const res = await fetch(`${API_URL}?action=${action}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    return json.data;
  } catch (err) {
    console.error("Ошибка GET запроса:", err);
    throw err;
  }
}

  // ============================================================
// ЗАПРОСЫ К API (Только через POST, чтобы обойти CORS)
// ============================================================
async function apiPost(action, payload) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    return json.message;
  } catch (err) {
    console.error("Ошибка POST запроса:", err);
    throw err;
  }
}

  // ============================================================
  // ЗАГРУЗКА СПИСКА
  // ============================================================
  // Загрузка списка теперь тоже через POST
async function loadParts() {
  const select = document.getElementById('partSelect');
  select.innerHTML = '<option value="">⏳ Загрузка...</option>';
  select.disabled = true;
  showStatus('info', '🔄 Загрузка списка...');
  
  try {
    // Мы отправляем POST-запрос с action: 'getParts'
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getParts' })
    });
    
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    
    partList = json.data;
    updateSelect(partList);
    showStatus('success', '✅ Загружено ' + partList.length + ' парт-номеров');
  } catch (err) {
    select.innerHTML = '<option value="">❌ Ошибка загрузки</option>';
    select.disabled = false;
    showStatus('error', '❌ Ошибка: ' + err.message);
  }
}
  
  function updateSelect(parts) {
    const select = document.getElementById('partSelect');
    select.innerHTML = '';
    select.disabled = false;
    
    if (!parts || parts.length === 0) {
      select.innerHTML = '<option value="">❌ Нет данных</option>';
      return;
    }
    
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = 'Выберите парт-номер...';
    select.appendChild(opt);
    
    parts.forEach(function(p) {
      const o = document.createElement('option');
      o.value = p.partNumber;
      o.textContent = p.partNumber + ' (' + (p.available || 0) + ' шт.)';
      select.appendChild(o);
    });
  }
  
  function onPartSelect() {
    const select = document.getElementById('partSelect');
    const selected = select.value;
    const display = document.getElementById('availableDisplay');
    if (!selected) { display.textContent = '-'; return; }
    const part = partList.find(p => p.partNumber === selected);
    display.textContent = part ? (part.available || 0) : '?';
  }

  // ============================================================
  // КАМЕРА
  // ============================================================
  async function startCamera() {
    const video = document.getElementById('video');
    const container = document.getElementById('camera-container');
    const scannerBox = document.getElementById('scannerBox');
    const scanBtn = document.getElementById('scanBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = videoStream;
      await video.play();
      
      container.style.display = 'block';
      scannerBox.style.display = 'none';
      stopBtn.classList.remove('hidden');
      scanBtn.classList.add('hidden');
      
      if (scanInterval) clearInterval(scanInterval);
      scanInterval = setInterval(() => scanQR(video), 500);
      showStatus('info', '📷 Наведите на QR-код...');
      
    } catch (err) {
      showStatus('error', 'Камера недоступна: ' + err.message);
    }
  }

  function scanQR(video) {
    if (!video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    
    if (code && code.data) {
      scannedData = code.data;
      document.getElementById('qrResult').value = code.data;
      document.getElementById('resultBox').style.display = 'block';
      stopCamera();
      showStatus('success', '✅ QR-код распознан!');
    }
  }

  function stopCamera() {
    if (scanInterval) clearInterval(scanInterval);
    if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    
    document.getElementById('video').srcObject = null;
    document.getElementById('camera-container').style.display = 'none';
    document.getElementById('scannerBox').style.display = 'flex';
    document.getElementById('scanBtn').classList.remove('hidden');
    document.getElementById('stopBtn').classList.add('hidden');
    showStatus('info', '⏹ Сканер остановлен');
  }

  // ============================================================
  // ОТГРУЗКА ПО QR
  // ============================================================
  async function confirmShipment() {
    if (!scannedData) { showStatus('error', '❌ Нет данных'); return; }
    const parts = scannedData.split('|');
    if (parts.length !== 2) {
      showStatus('error', 'Неверный формат QR-кода');
      return;
    }
    try {
      const msg = await apiPost('ship', { partNumber: parts[0], quantity: 1 });
      showStatus('success', msg);
      scannedData = null;
      document.getElementById('resultBox').style.display = 'none';
      loadParts();
    } catch (err) {
      showStatus('error', err.message);
    }
  }

  // ============================================================
  // РУЧНЫЕ ОПЕРАЦИИ
  // ============================================================
  async function manualOperation(action) {
    const part = document.getElementById('partSelect').value;
    const qty = parseInt(document.getElementById('qtyInput').value);
    if (!part || !qty || qty < 1) {
      showStatus('error', '❌ Выберите парт-номер и количество');
      return;
    }
    try {
      const msg = await apiPost(action, { partNumber: part, quantity: qty });
      showStatus('success', msg);
      document.getElementById('qtyInput').value = '1';
      loadParts();
    } catch (err) {
      showStatus('error', '❌ ' + err.message);
    }
  }

  // ============================================================
  // РУЧНАЯ ОТГРУЗКА ПО ВВОДУ ТЕКСТА
  // ============================================================
  async function manualPartShipment() {
    const partInput = document.getElementById('manualPartInput');
    const qtyInput = document.getElementById('manualQtyInput');
    const part = partInput.value.trim().toUpperCase();
    const qty = parseInt(qtyInput.value);
    
    if (!part) { showStatus('error', '❌ Введите парт-номер'); partInput.focus(); return; }
    if (!qty || qty < 1) { showStatus('error', '❌ Введите количество'); qtyInput.focus(); return; }
    
    try {
      const msg = await apiPost('ship', { partNumber: part, quantity: qty });
      showStatus('success', msg);
      partInput.value = '';
      qtyInput.value = '1';
      loadParts();
      partInput.focus();
    } catch (err) {
      showStatus('error', '❌ ' + err.message);
    }
  }

  // ============================================================
  // СТАТУС
  // ============================================================
  function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'status-' + type;
    el.style.display = 'block';
    el.innerHTML = msg.replace(/\n/g, '<br>');
  }

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    loadParts();
    
    document.getElementById('manualPartInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('manualQtyInput').focus(); }
    });
    document.getElementById('manualQtyInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); manualPartShipment(); }
    });
    document.getElementById('qtyInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); manualOperation('ship'); }
    });
  });
</script>
</body>
</html>
